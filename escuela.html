/* ============================================================
   DESIGN SYSTEM (shared with landing)
   ============================================================ */
:root {
  /* light default */
  --c-bg:        #f8f4ed;
  --c-bg-soft:   #f0ebe0;
  --c-blue:      #1D3D91;
  --c-green:     #8ABE28;
  --c-gold:      #b8892e;
  --c-gold-bright:#D4A84B;
  --c-gold-dim:   rgba(197, 150, 62, 0.25);
  --c-gold-faint: rgba(197, 150, 62, 0.10);
  --c-ink:       #1a1512;
  --c-ink-dim:   rgba(26, 21, 18, 0.65);
  --c-ink-faint: rgba(26, 21, 18, 0.18);
  --c-cream:     #1a1512;
  --c-cream-dim: rgba(26, 21, 18, 0.65);
  --c-cream-faint:rgba(26, 21, 18, 0.18);

  --f-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --f-mark:    'Schrifted', 'Cinzel', Georgia, serif;
  --f-body:    'Schrifted', 'Jost', system-ui, -apple-system, sans-serif;

  --gutter:    clamp(1.5rem, 5vw, 5rem);
  --ease:      cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="dark"] {
  --c-bg:        #0a0e1a;
  --c-bg-soft:   #111624;
  --c-gold:      #CE9A47;
  --c-gold-bright:#e0b85a;
  --c-gold-dim:   rgba(206, 154, 71, 0.30);
  --c-gold-faint: rgba(206, 154, 71, 0.12);
  --c-ink:       #FFFFFF;
  --c-ink-dim:   rgba(243, 236, 224, 0.65);
  --c-ink-faint: rgba(243, 236, 224, 0.22);
  --c-cream:     #FFFFFF;
  --c-cream-dim: rgba(243, 236, 224, 0.65);
  --c-cream-faint:rgba(243, 236, 224, 0.22);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  background: var(--c-bg);
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: var(--f-body);
  color: var(--c-cream);
  background: var(--c-bg);
  line-height: 1.65;
  overflow-x: hidden;
  transition: background 0.4s var(--ease), color 0.3s var(--ease);
  animation: fade-in 0.6s var(--ease) both;
}

img { max-width: 100%; display: block; }
a  { color: inherit; text-decoration: none; }

h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 500;
  letter-spacing: 0.01em;
  line-height: 1.1;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---- grain ---- */
.grain {
  position: fixed; inset: 0; z-index: 999;
  pointer-events: none; opacity: 0.04;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-repeat: repeat;
}

/* ---- buttons ---- */
.btn {
  font-family: var(--f-body);
  font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 0.9em 1.7em; border-radius: 2px;
  border: 1px solid transparent;
  display: inline-flex; align-items: center;
  transition: transform 0.4s var(--ease), background 0.4s, border-color 0.4s, color 0.4s;
  cursor: pointer;
}
.btn--gold {
  background: var(--c-gold); color: var(--c-bg); border-color: var(--c-gold);
}
.btn--gold:hover { background: var(--c-gold-bright); transform: translateY(-1px); }
.btn--ghost {
  border-color: var(--c-cream-faint); color: var(--c-cream);
}
.btn--ghost:hover { border-color: var(--c-cream); transform: translateY(-1px); }

/* ============================================================
   NAV
   ============================================================ */
.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.5rem var(--gutter);
  font-family: var(--f-mark);
  font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--c-ink);
  transition: padding 0.4s var(--ease), background 0.4s var(--ease);
}
.site-nav.is-scrolled {
  background: color-mix(in srgb, var(--c-bg) 96%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--c-border);
}
[data-theme="dark"] .site-nav {
  color: var(--c-cream);
}
.site-nav__logo { height: 36px; width: auto; display: block; }
.site-nav__logo-dark { display: none; }
[data-theme="dark"] .site-nav__logo-light { display: none; }
[data-theme="dark"] .site-nav__logo-dark { display: block; }



  // hamburger
  var hamburger = document.getElementById('hamburger');
  var mobileMenu = document.getElementById('mobile-menu');
  hamburger.addEventListener('click', function(){
    var open = hamburger.classList.toggle('is-open');
    mobileMenu.classList.toggle('is-open');
    hamburger.setAttribute('aria-expanded', open);
  });
  mobileMenu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      hamburger.classList.remove('is-open');
      mobileMenu.classList.remove('is-open');
      hamburger.setAttribute('aria-expanded', 'false');
    });
  });

  
  // nav scroll blur
  var nav = document.querySelector('.site-nav');
  window.addEventListener('scroll', function(){
    if (nav) nav.classList.toggle('is-scrolled', window.pageYOffset > 50);
  });
  // back to top
  var btt = document.getElementById('back-to-top');
  window.addEventListener('scroll', function(){
    if (btt) btt.classList.toggle('is-visible', window.pageYOffset > 400);
  });
  if (btt) btt.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // lightbox
  var lightbox = document.getElementById('lightbox');
  if (!lightbox) return;
  var lightboxImg = document.getElementById('lightbox-img');
  var clickableImgs = document.querySelectorAll('.room__media img, .feature-image img, .section-hero img, .gallery img, .casa-strip img, .obra-card__image img, .docente-card__photo img, .split__image img');
  clickableImgs.forEach(function(img){
    img.style.cursor = 'pointer';
    img.addEventListener('click', function(){
      lightboxImg.src = img.src; lightboxImg.alt = img.alt;
      lightbox.classList.add('is-open');
    });
  });
  document.getElementById('lightbox-close').addEventListener('click', function(){ lightbox.classList.remove('is-open'); });
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) lightbox.classList.remove('is-open'); });


  // PWA
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }
})();

<script src="/assets/js/push.js" defer></script>
<script>
(function(){
  var grid = document.getElementById('docentes-grid');
  if(!grid) return;

  fetch('/api/docentes', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'list'})})
    .then(function(r){ return r.json(); })
    .then(function(data){
      var docentes = data.docentes || [];
      var activos = (docentes||[]).filter(function(d){ return d.activo !== false; });
      if(!activos.length){ grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.6;padding:2rem">Docentes próximamente.</p>'; return; }

      grid.innerHTML = activos.map(function(d){
        var foto = d.foto || 'assets/images/elenco/WhatsApp Image 2026-06-14 at 1.22.57 PM.jpeg';
        var ig = d.instagram
          ? '<a href="https://www.instagram.com/' + escAttr(d.instagram.replace('@','')) + '" target="_blank" rel="noopener" style="font-size:0.75rem;color:var(--c-cream-faint);display:inline-flex;align-items:center;gap:0.3rem;margin-top:0.3rem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg> ' + escAttr(d.instagram) + '</a>'
          : '';
        var trayect = d.trayectoria
          ? '<p style="font-size:0.78rem;color:var(--c-gold);margin-top:0.5rem">' + escHtml(d.trayectoria).replace(/\n\n/g, '</p><p style="font-size:0.78rem;color:var(--c-gold);margin-top:0.3rem">').replace(/\n/g, '<br>') + '</p>'
          : '';
        var whatsapp = d.whatsapp
          ? '<a href="https://wa.me/' + escAttr(String(d.whatsapp).replace(/\D/g,'')) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:0.3rem;font-size:0.8rem;color:var(--c-gold);margin-top:0.3rem">💬 Contactar</a>'
          : '';
        var tieneExtra = d.trayectoria || d.instagram || d.whatsapp;
        return '<article class="docente-card reveal">' +
          '<div class="docente-card__photo"><img src="' + escAttr(foto) + '" alt="' + escAttr(d.nombre) + '" loading="lazy"></div>' +
          '<div class="docente-card__body">' +
            '<h4>' + escHtml(d.nombre) + '</h4>' +
            '<p class="docente-card__rol">' + escHtml(d.rol) + '</p>' +
            (d.frase ? '<p class="docente-card__quote">' + escHtml(d.frase) + '</p>' : '') +
            (tieneExtra ? '<button class="docente-card__toggle">+ M\u00e1s info</button><div class="docente-card__extra">' + trayect + ig + whatsapp + '<a href="compania.html" style="display:inline-block;margin-top:0.6rem;font-size:0.78rem;color:var(--c-gold)">Ver en Compañía →</a></div>' : trayect + ig + '<a href="compania.html" style="display:inline-block;margin-top:0.6rem;font-size:0.78rem;color:var(--c-gold)">Ver en Compañía →</a>') +
          '</div></article>';
      }).join('');

      // Bind toggle buttons
      setTimeout(function(){
        document.querySelectorAll('.docente-card__toggle').forEach(function(btn){
          btn.addEventListener('click', function(){
            var extra = btn.parentElement.querySelector('.docente-card__extra');
            var open = extra.classList.toggle('is-open');
            btn.textContent = open ? '− Menos info' : '+ Más info';
          });
        });
      }, 50);

      // Re-trigger scroll reveals
      setTimeout(function(){
        document.querySelectorAll('.docente-card.reveal').forEach(function(c){
          var obs = new IntersectionObserver(function(e){
            e.forEach(function(entry){ if(entry.isIntersecting) entry.target.classList.add('is-visible'); });
          },{threshold:0.15});
          obs.observe(c);
        });
      },100);
    })
    .catch(function(){ grid.innerHTML = ''; });

  function escHtml(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
  function escAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
})();
</script>
